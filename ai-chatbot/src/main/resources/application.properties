spring.application.name=ai-chatbot
server.port=8080

# -------------------------------------------------------------
# Exclude unused OpenAI auto-configurations (Speech, Transcription, Image, Moderation, and OpenAI Embedding)
# -------------------------------------------------------------
spring.autoconfigure.exclude=\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration

# -------------------------------------------------------------
# Groq Chat Configuration (OpenAI-compatible)
# Supports GROQ_API_KEY, groq_api, or GROQ_API
# -------------------------------------------------------------
spring.ai.openai.chat.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.api-key=${GROQ_API_KEY:${groq_api:${GROQ_API:}}}
spring.ai.openai.chat.options.model=openai/gpt-oss-120b

# -------------------------------------------------------------
# Pinecone Vector Store Configuration
# Supports PINECONE_API_KEY, pinecone_api, or PINECONE_API
# -------------------------------------------------------------
spring.ai.vectorstore.type=none
spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY:${pinecone_api:${PINECONE_API:}}}
spring.ai.vectorstore.pinecone.environment=${PINECONE_ENVIRONMENT:gcp-starter}
spring.ai.vectorstore.pinecone.index-name=${PINECONE_INDEX_NAME:ai-chatbot}
spring.ai.vectorstore.pinecone.namespace=${PINECONE_NAMESPACE:}

# -------------------------------------------------------------
# Multipart Upload Limits (for PDF document uploads)
# -------------------------------------------------------------
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# -------------------------------------------------------------
# Server & Logging
# -------------------------------------------------------------
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.force-response=true

logging.level.org.springframework.ai=INFO
logging.level.com.spring.ai_chatbot=DEBUG
