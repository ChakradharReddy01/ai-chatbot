spring.application.name=ai-chatbot
server.port=${PORT:8080}

# -------------------------------------------------------------
# Exclude unused OpenAI auto-configurations (Speech, Transcription, Image, Moderation, and OpenAI Embedding)
# -------------------------------------------------------------
spring.autoconfigure.exclude=\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration

# -------------------------------------------------------------
# H2 In-Memory Database & JPA Configuration (Weather, Travel & Chat History)
# -------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:chatbotdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------------------------------------------
# 3rd-Party Live Weather API Configuration
# Primary: WeatherAPI.com (supports WEATHER_API_KEY)
# Automatic Fallback: Open-Meteo (100% Free, no key required)
# -------------------------------------------------------------
spring.weather.api-key=${WEATHER_API_KEY:${weather_api_key:${WEATHER_API:}}}
spring.weather.api-url=https://api.weatherapi.com/v1

# -------------------------------------------------------------
# Groq Chat Configuration (OpenAI-compatible)
# Recommended Groq models with high-speed tool calling support:
# - llama-3.3-70b-versatile (State-of-the-art reasoning, excellent tool calling)
# - llama-3.1-8b-instant (Ultra-fast, lightweight)
# - openai/gpt-oss-120b (High-parameter OSS)
# -------------------------------------------------------------
spring.ai.openai.chat.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.api-key=${GROQ_API_KEY:${groq_api:${GROQ_API:}}}
spring.ai.openai.chat.options.model=openai/gpt-oss-120b

# -------------------------------------------------------------
# Pinecone Vector Store Configuration
# Supports PINECONE_API_KEY, pinecone_api, or PINECONE_API
# -------------------------------------------------------------
spring.ai.vectorstore.type=none
spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY:${pinecone_api:${PINECONE_API:}}}
spring.ai.vectorstore.pinecone.environment=${PINECONE_ENVIRONMENT:gcp-starter}
spring.ai.vectorstore.pinecone.index-name=${PINECONE_INDEX_NAME:ai-chatbot}
spring.ai.vectorstore.pinecone.namespace=${PINECONE_NAMESPACE:}

# -------------------------------------------------------------
# Multipart Upload Limits (for PDF document uploads)
# -------------------------------------------------------------
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# -------------------------------------------------------------
# Server & Logging
# -------------------------------------------------------------
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.force-response=true

logging.level.org.springframework.ai=INFO
logging.level.com.spring.ai_chatbot=DEBUG
